name: TamaNDI
options:
  bundleIdPrefix: com.tamandicam
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  BUILD_LIBRARY_FOR_DISTRIBUTION: YES
  TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad

targets:
  Domain:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.domain
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Camera:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Camera
    dependencies:
      - target: Domain
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.camera
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  MultiCam:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MultiCam
    dependencies:
      - target: Domain
      - target: Camera
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.multicam
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  NDI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/NDI
    dependencies:
      - target: Domain
      - target: Camera
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.ndi
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Audio:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Audio
    dependencies:
      - target: Domain
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.audio
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Remote:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Remote
    dependencies:
      - target: Domain
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.remote
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Persistence:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Persistence
    dependencies:
      - target: Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.persistence
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Diagnostics:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Diagnostics
    dependencies:
      - target: Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.diagnostics
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/UI
    dependencies:
      - target: Domain
      - target: Camera
      - target: Audio
      - target: NDI
      - target: Remote
      - target: Persistence
      - target: Diagnostics
      - sdk: AVFoundation.framework
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.ui
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  TamaNDI:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        createIntermediateGroups: true
      - path: web
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: "TamaNDI"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamandicam.app
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - target: Domain
      - target: Camera
      - target: MultiCam
      - target: NDI
      - target: Audio
      - target: Remote
      - target: Persistence
      - target: Diagnostics
      - target: UI
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: Network.framework
      - sdk: UIKit.framework

  TamaNDITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DomainTests
      - path: Tests/CameraTests
      - path: Tests/MultiCamTests
      - path: Tests/NDITests
      - path: Tests/AudioTests
      - path: Tests/RemoteTests
      - path: Tests/PersistenceTests
      - path: Tests/DiagnosticsTests
      - path: Tests/UITests
    dependencies:
      - target: TamaNDI
      - target: Domain
      - target: Camera
      - target: MultiCam
      - target: NDI
      - target: Audio
      - target: Remote
      - target: Persistence
      - target: Diagnostics
      - target: UI

schemes:
  TamaNDI:
    build:
      targets:
        Domain: all
        Camera: all
        MultiCam: all
        NDI: all
        Audio: all
        Remote: all
        Persistence: all
        Diagnostics: all
        UI: all
        TamaNDI: all
        TamaNDITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TamaNDITests
    profile:
      config: Release
    archive:
      config: Release
